<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Off</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Полноэкранное видео off.mp4 */
        #fullscreen-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* Кнопка возврата на mushroom.html (скрыта по умолчанию) */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 20;
            width: 80px;
            height: 80px;
            display: block;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            text-decoration: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .back-btn.show {
            opacity: 1;
            visibility: visible;
        }

        .back-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
        }

        /* Мобильный адаптив */
        @media (max-width: 768px) {
            .back-btn {
                width: 65px;
                height: 65px;
                top: 15px;
                left: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Кнопка возврата на главную (mushroom.html) -->
    <a href="mushroom.html" class="back-btn" id="back-btn">
        <img src="back.png" alt="Back">
    </a>

    <!-- Видеопроигрыватель на весь экран с зацикливанием (loop) -->
    <video id="fullscreen-video" autoplay loop controls playsinline>
        <source src="off.mp4" type="video/mp4">
    </video>

    <script>
        const backBtn = document.getElementById('back-btn');

        // Показываем кнопку назад через 2 секунды после начала воспроизведения (пока видео идет по кругу)
        setTimeout(() => {
            backBtn.classList.add('show');
        }, 2000);
    </script>
</body>
</html>
