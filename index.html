<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyKinderGarten</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }

        /* 1. Фоновое видео на весь экран */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 2;
            pointer-events: none;
        }

        /* 2. Три вертикальных портала в ряд */
        .portals-container {
            position: fixed;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: row;
            gap: 50px;
            z-index: 10;
            align-items: center;
            justify-content: center;
            max-width: 95vw;
        }

        .portal-card {
            width: min(220px, 22vw);
            height: min(330px, 33vw);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Убраны любые переходы, анимации и эффекты при наведении */
        }

        .portal-card.no-click {
            cursor: default;
        }

        .portal-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.8));
        }

        /* 3. Иконка Glock19 (Soundcloud) */
        .sc-link-box {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 100px;
            height: 100px;
            display: block;
            background: transparent;
            box-shadow: none;
            border-radius: 0;
            overflow: visible;
        }

        .sc-link-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
        }

        /* 4. Модальное окно для видео */
        #video-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #video-modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 800px;
            cursor: default;
        }

        .modal-content video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- ФОНОВОЕ ВИДЕО -->
    <video id="bg-video" autoplay loop playsinline>
        <source src="background.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <!-- ТРИ ПОРТАЛА В РЯД -->
    <div class="portals-container">
        <div class="portal-card" onclick="openVideo('edits.mp4')">
            <img src="caps.png" alt="Edit 1">
        </div>
        <div class="portal-card" onclick="openVideo('edits2.mp4')">
            <img src="caps2.png" alt="Edit 2">
        </div>
        <div class="portal-card no-click">
            <img src="caps3.png" alt="Edit 3">
        </div>
    </div>

    <!-- ИКОНКА GLOCK19 (SOUNDCLOUD) -->
    <a href="https://soundcloud.com/naduvanie_online" target="_blank" class="sc-link-box" title="Soundcloud">
        <img src="glock19.png" alt="Glock19">
    </a>

    <!-- МОДАЛЬНОЕ ОКНО С ВИДЕО -->
    <div id="video-modal" onclick="closeVideo()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <video id="popup-player" controls preload="auto" playsinline>
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <script>
        const modal = document.getElementById('video-modal');
        const player = document.getElementById('popup-player');
        const bgVideo = document.getElementById('bg-video');

        // Включение звука фона по первому клику
        window.addEventListener('click', () => {
            if (bgVideo.paused) {
                bgVideo.play().catch(() => {});
            }
        }, { once: true });

        function openVideo(videoSrc) {
            bgVideo.pause();
            
            player.src = videoSrc;
            player.load();
            modal.classList.add('active');
            
            player.play().catch(err => {
                console.log("Ошибка воспроизведения:", err);
            });
        }

        function closeVideo() {
            player.pause();
            player.src = '';
            modal.classList.remove('active');
            bgVideo.play().catch(() => {});
        }

        // Закрытие по ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeVideo();
            }
        });
    </script>
</body>
</html>
