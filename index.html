<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyMushroomGarden</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }

        #site-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Эффект выключения старого телевизора (TV Turn Off / CRT Off) */
        #site-wrapper.tv-off {
            animation: tvShutdown 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            transform-origin: center center;
        }

        @keyframes tvShutdown {
            0% {
                transform: scale(1, 1);
                filter: brightness(1);
            }
            40% {
                transform: scale(1, 0.005);
                filter: brightness(2); /* Небольшая вспышка по центру */
            }
            100% {
                transform: scale(0, 0);
                filter: brightness(0);
            }
        }

        /* 1. Кнопка выключения */
        .power-btn {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 120px;
            height: 120px;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .power-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
        }

        .power-btn:hover {
            transform: translateX(-50%) scale(1.1);
            filter: brightness(1.2);
        }

        /* Фоновое видео */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 2;
            pointer-events: none;
        }

        /* Контейнер порталов */
        .portals-container {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: row;
            gap: 100px;
            z-index: 10;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 95vw;
        }

        .portal-card {
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Размеры карточек */
        .portal-card.card-1 {
            width: 260px;
            height: 260px;
        }

        .portal-card.card-2 {
            width: 220px;
            height: 330px;
        }

        .portal-card.card-3 {
            width: 200px;
            height: 320px;
        }

        .portal-card.no-click {
            cursor: default;
        }

        .portal-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: none;
        }

        /* Иконка Soundcloud */
        .sc-link-box {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 100px;
            height: 100px;
            display: block;
            background: transparent;
            box-shadow: none;
        }

        .sc-link-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
        }

        /* Модалка для обычных видео */
        #video-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #video-modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 800px;
            cursor: default;
        }

        .modal-content video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        /* Экран выключения с off.mp4 */
        #shutdown-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999999;
            display: none;
            width: 100vw;
            height: 100vh;
        }

        #shutdown-screen.active {
            display: block;
        }

        #shutdown-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="site-wrapper">
        <button class="power-btn" onclick="triggerShutdown(event)" title="Выключить">
            <img src="power.png" alt="Power Off">
        </button>

        <video id="bg-video" autoplay muted loop playsinline>
            <source src="background.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>

        <div class="portals-container">
            <div class="portal-card card-1" onclick="openVideo('edits.mp4')">
                <img src="caps.png" alt="Edit 1">
            </div>
            <div class="portal-card card-2" onclick="openVideo('edits2.mp4')">
                <img src="caps2.png" alt="Edit 2">
            </div>
            <div class="portal-card card-3 no-click">
                <img src="caps3.png" alt="Edit 3">
            </div>
        </div>

        <a href="https://soundcloud.com/naduvanie_online" target="_blank" class="sc-link-box" title="Soundcloud">
            <img src="glock19.png" alt="Glock19">
        </a>
    </div>

    <div id="video-modal" onclick="closeVideo()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <video id="popup-player" controls preload="auto" playsinline></video>
        </div>
    </div>

    <div id="shutdown-screen">
        <video id="shutdown-video" loop playsinline>
            <source src="off.mp4" type="video/mp4">
        </video>
    </div>

    <audio id="btn-sound" src="button.mp3" preload="auto"></audio>

    <script>
        const modal = document.getElementById('video-modal');
        const player = document.getElementById('popup-player');
        const bgVideo = document.getElementById('bg-video');
        const siteWrapper = document.getElementById('site-wrapper');
        const shutdownScreen = document.getElementById('shutdown-screen');
        const shutdownVideo = document.getElementById('shutdown-video');
        const btnSound = document.getElementById('btn-sound');

        let isShutdown = false;

        window.addEventListener('click', () => {
            if (bgVideo && bgVideo.muted && !isShutdown) {
                bgVideo.muted = false;
            }
        }, { once: true });

        function openVideo(videoSrc) {
            if (isShutdown) return;
            if (bgVideo) bgVideo.pause();
            player.src = videoSrc;
            player.load();
            modal.classList.add('active');
            player.play().catch(() => {});
        }

        function closeVideo() {
            if (isShutdown) return;
            player.pause();
            player.src = '';
            modal.classList.remove('active');
            if (bgVideo) bgVideo.play().catch(() => {});
        }

        // ВЫКЛЮЧЕНИЕ С ЭФФЕКТОМ ТЕЛЕВИЗОРА
        function triggerShutdown(e) {
            if (e) e.stopPropagation();
            isShutdown = true;

            // 1. Звук клика
            if (btnSound) btnSound.play().catch(() => {});

            // 2. Запускаем анимацию выключения ТВ (0.5 сек)
            siteWrapper.classList.add('tv-off');

            // 3. Через 0.5 сек останавливаем фон, убираем весь интерфейс и держим ТЁМНЫЙ ЭКРАН 1 секунду
