<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyMushroomGarden</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }

        /* 1. Фоновое видео на весь экран */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 2;
            pointer-events: none;
        }

        /* 2. Три портала в ряд по центру */
        .portals-container {
            position: fixed;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: row;
            gap: 60px;
            z-index: 10;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .portal-card {
            width: 170px;  /* Фиксированная аккуратная ширина */
            height: 255px; /* Фиксированная пропорциональная высота */
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .portal-card.no-click {
            cursor: default;
        }

        .portal-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            /* УБРАНО ЛЮБОЕ РАЗМЫТИЕ И ТЕНИ: Края теперь максимально резкие */
            filter: none;
        }

        /* 3. Иконка Glock19 (Soundcloud) */
        .sc-link-box {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 100px;
            height: 100px;
            display: block;
            background: transparent;
            box-shadow: none;
            border-radius: 0;
            overflow: visible;
        }

        .sc-link-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            /* У глока тень оставляем для объёма, или тоже filter: none; если не нужно */
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
        }

        /* 4. Модальное окно для видео */
        #video-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
