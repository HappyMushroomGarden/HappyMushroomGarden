<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyMushroomGarden</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }

        /* 0. СТАРТОВЫЙ ЭКРАН-ЗАГЛУШКА */
        #start-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #start-screen.hidden {
            display: none !important;
        }

        .start-card {
            position: relative;
            width: 90vw;
            max-width: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .start-card img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
        }

        .start-click-area {
            position: absolute;
            top: 42%;
            left: 42%;
            width: 20%;
            height: 18%;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
            z-index: 99;
            display: block;
        }

        #site-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            opacity: 0;
        }

        #site-wrapper.visible {
            opacity: 1;
        }

        /* АНИМАЦИЯ ВЫКЛЮЧЕНИЯ ТЕЛЕВИЗОРА */
        #site-wrapper.tv-off {
            animation: tvShutdown 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            transform-origin: center center;
        }

        @keyframes tvShutdown {
            0% {
                transform: scale(1, 1);
                filter: brightness(1);
            }
            40% {
                transform: scale(1, 0.005);
                filter: brightness(2);
            }
            100% {
                transform: scale(0, 0);
                filter: brightness(0);
            }
        }

        /* Кнопка выключения в левом верхнем углу */
        .power-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 20;
            width: 80px;
            height: 80px;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
        }

        .power-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
        }

        /* Фоновое видео */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 2;
            pointer-events: none;
        }

        /* КОНТЕЙНЕР ВСЕХ ПОРТАЛОВ В РЯД */
        .portals-container {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: row;
            gap: 25px;
            z-index: 10;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 98vw;
        }

        .portal-card {
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .portal-card.disabled {
            cursor: default;
        }

        /* Размеры элементов: основные стоят на месте, 4-й и 5-й смещены ниже через translateY */
        .portal-card.card-1 {
            width: 190px;
            height: 190px;
        }

        .portal-card.card-4 {
            width: 160px;
            height: 160px;
            transform: translateY(65px); /* Смещен вниз между 1 и 2 */
        }

        .portal-card.card-2 {
            width: 160px;
            height: 240px;
        }

        .portal-card.card-5 {
            width: 160px;
            height: 160px;
            transform: translateY(65px); /* Смещен вниз между 2 и 3 */
        }

        .portal-card.card-3 {
            width: 170px;
            height: 250px;
        }

        .portal-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.6));
        }

        /* Иконка Links (Glock19) */
        .sc-link-box {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 50px;
            height: 50px;
            display: block;
            background: transparent;
            box-shadow: none;
        }

        .sc-link-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.6));
        }

        /* АДАПТИВ ПОД МОБИЛЬНЫЕ ТЕЛЕФОНЫ */
        @media (max-width: 768px) {
            .portals-container {
                gap: 8px;
            }

            .portal-card.card-1 {
                width: 60px;
                height: 60px;
            }

            .portal-card.card-4 {
                width: 50px;
                height: 50px;
                transform: translateY(22px);
            }

            .portal-card.card-2 {
                width: 55px;
                height: 80px;
            }

            .portal-card.card-5 {
                width: 50px;
                height: 50px;
                transform: translateY(22px);
            }

            .portal-card.card-3 {
                width: 60px;
                height: 85px;
            }

            .power-btn {
                width: 65px;
                height: 65px;
                top: 15px;
                left: 15px;
            }

            .sc-link-box {
                width: 40px;
                height: 40px;
                bottom: 20px;
            }
        }

        /* Модалка для видео */
        #video-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #video-modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 800px;
            cursor: default;
        }

        .modal-content video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        /* Экран выключения с off.mp4 */
        #shutdown-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999999;
            display: none;
            width: 100vw;
            height: 100vh;
        }

        #shutdown-screen.active {
            display: block;
        }

        #shutdown-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div id="start-screen">
        <div class="start-card">
            <img src="start.png" alt="Start Screen">
            <button class="start-click-area" onclick="startSite()"></button>
        </div>
    </div>

    <!-- Звук для стартовой кнопки -->
    <audio id="start-sound" src="start-sound.mp3" preload="auto"></audio>

    <div id="site-wrapper">
        <!-- КНОПКА ВЫКЛЮЧЕНИЯ -->
        <button class="power-btn" onclick="triggerShutdown(event)">
            <img src="power.png" alt="Power Off">
        </button>

        <video id="bg-video" loop playsinline>
            <source src="background.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>

        <!-- ВСЕ 5 ПОРТАЛОВ В СТРОГОМ ПОРЯДКЕ -->
        <div class="portals-container">
            <!-- 1 портал -->
            <div class="portal-card card-1" onclick="openVideo('edits.mp4')">
                <img src="caps.png" alt="Edit 1">
            </div>

            <!-- 4 портал (между 1 и 2, ниже) -->
            <div class="portal-card card-4" onclick="openVideo('edits4.mp4')">
                <img src="caps4.png" alt="Edit 4">
            </div>

            <!-- 2 портал -->
            <div class="portal-card card-2" onclick="openVideo('edits2.mp4')">
                <img src="caps2.png" alt="Edit 2">
            </div>

            <!-- 5 портал (между 2 и 3, ниже, заглушка) -->
            <div class="portal-card card-5 disabled">
                <img src="caps5.png" alt="Edit 5">
            </div>

            <!-- 3 портал -->
            <div class="portal-card card-3" onclick="openVideo('edits3.mp4')">
                <img src="caps3.png" alt="Edit 3">
            </div>
        </div>

        <!-- Иконка glock19 ведет на страницу links.html -->
        <a href="links.html" class="sc-link-box">
            <img src="glock19.png" alt="Glock19">
        </a>
    </div>

    <div id="video-modal" onclick="closeVideo()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <video id="popup-player" controls preload="auto" playsinline></video>
        </div>
    </div>

    <div id="shutdown-screen">
        <video id="shutdown-video" loop playsinline>
            <source src="off.mp4" type="video/mp4">
        </video>
    </div>

    <audio id="btn-sound" src="button.mp3" preload="auto"></audio>

    <script>
        const startScreen = document.getElementById('start-screen');
        const startSound = document.getElementById('start-sound');
        const modal = document.getElementById('video-modal');
        const player = document.getElementById('popup-player');
        const bgVideo = document.getElementById('bg-video');
        const siteWrapper = document.getElementById('site-wrapper');
        const shutdownScreen = document.getElementById('shutdown-screen');
        const shutdownVideo = document.getElementById('shutdown-video');
        const btnSound = document.getElementById('btn-sound');

        let isShutdown = false;

        function startSite() {
            if (startSound) {
                startSound.play().catch(() => {});
            }

            startScreen.classList.add('hidden');

            setTimeout(() => {
                siteWrapper.classList.add('visible');

                if (bgVideo) {
                    bgVideo.muted = false;
                    bgVideo.play().catch(err => {
                        console.log("Ошибка запуска фона:", err);
                    });
                }
            }, 1000);
        }

        function openVideo(videoSrc) {
            if (isShutdown) return;
            if (bgVideo) bgVideo.pause();
            player.src = videoSrc;
            player.load();
            modal.classList.add('active');
            player.play().catch(() => {});
        }

        function closeVideo() {
            if (isShutdown) return;
            player.pause();
            player.src = '';
            modal.classList.remove('active');
            if (bgVideo) bgVideo.play().catch(() => {});
        }

        function triggerShutdown(e) {
            if (e) e.stopPropagation();
            isShutdown = true;

            if (btnSound) btnSound.play().catch(() => {});
            siteWrapper.classList.add('tv-off');

            setTimeout(() => {
                if (bgVideo) bgVideo.pause();
                player.pause();
                modal.classList.remove('active');
                siteWrapper.style.display = 'none';

                setTimeout(() => {
                    shutdownScreen.classList.add('active');
                    shutdownVideo.currentTime = 0;
                    shutdownVideo.play().catch(() => {});
                }, 1000);

            }, 500);
        }

        document.addEventListener('keydown', (e) => {
            if (isShutdown) {
                e.preventDefault();
                return false;
            }
            if (e.key === 'Escape') {
                closeVideo();
            }
        });
    </script>
</body>
</html>
