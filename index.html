<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyMushroomGarden</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }

        /* 0. СТАРТОВЫЙ ЭКРАН-ЗАГЛУШКА */
        #start-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #start-screen.hidden {
            display: none !important;
        }

        .start-card {
            position: relative;
            width: 90vw;
            max-width: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .start-card img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
        }

        .start-click-area {
            position: absolute;
            top: 42%;
            left: 42%;
            width: 20%;
            height: 18%;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
            z-index: 99;
            display: block;
        }

        #site-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            opacity: 0;
        }

        #site-wrapper.visible {
            opacity: 1;
        }

        /* АНИМАЦИЯ ВЫКЛЮЧЕНИЯ ТЕЛЕВИЗОРА */
        #site-wrapper.tv-off {
            animation: tvShutdown 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            transform-origin: center center;
        }

        @keyframes tvShutdown {
            0% {
                transform: scale(1, 1);
                filter: brightness(1);
            }
            40% {
                transform: scale(1, 0.005);
                filter: brightness(2);
            }
            100% {
                transform: scale(0, 0);
                filter: brightness(0);
            }
        }

        /* 1. Кнопка выключения в левом верхнем углу */
        .power-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 20;
            width: 80px;
            height: 80px;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
        }

        .power-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
        }

        /* Фоновое видео */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 2;
            pointer-events: none;
        }

        /* Контейнер порталов */
        .portals-container {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: row;
            gap: 40px;
            z-index: 10;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 98vw;
        }

        .portal-card {
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow
