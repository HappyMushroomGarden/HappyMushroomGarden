<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyMushroomGarden</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }

        /* 0. СТАРТОВЫЙ ЭКРАН-ЗАГЛУШКА */
        #start-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #start-screen.hidden {
            display: none !important;
        }

        /* Контейнер картинки: фиксированная карточка без подсветки и без реакций на наведение */
        .start-card {
            position: relative;
            width: 90vw;
            max-width: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .start-card img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
        }

        /* Невидимая кликабельная зона ровно над кнопкой в центре */
        .start-click-area {
            position: absolute;
            top: 42%;
            left: 42%;
            width: 20%;
            height: 18%;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
            z-index: 99;
            display: block;
        }

        #site-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            opacity: 0;
        }

        /* АНИМАЦИЯ ВКЛЮЧЕНИЯ СТАРОГО ТЕЛЕВИЗОРА (CRT ON) */
        #site-wrapper.tv-on {
            animation: tvTurnOn 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            transform-origin: center center;
        }

        @keyframes tvTurnOn {
            0% {
                transform: scale(0, 0.005);
                filter: brightness(3);
                opacity: 0;
            }
            35% {
                transform: scale(1, 0.005);
                filter: brightness(2.5);
                opacity: 1;
            }
            100% {
                transform: scale(1, 1);
                filter: brightness(1);
                opacity: 1;
            }
        }

        /* АНИМАЦИЯ ВЫКЛЮЧЕНИЯ СТАРОГО ТЕЛЕВИЗОРА (CRT OFF) */
        #site-wrapper.tv-off {
            animation: tvShutdown 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            transform-origin: center center;
        }

        @keyframes tvShutdown {
            0% {
                transform: scale(1, 1);
                filter: brightness(1);
            }
            40% {
                transform: scale(1, 0.005);
                filter: brightness(2);
            }
            100% {
                transform: scale(0, 0);
                filter: brightness(0);
            }
        }

        /* 1. Кнопка выключения на самом сайте */
        .power-btn {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 120px;
            height: 120px;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
        }

        .power-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
        }

        /* Фоновое видео */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 2;
            pointer-events: none;
        }

        /* Контейнер порталов */
        .portals-container {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: row;
            gap: 100px;
            z-index: 10;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 95vw;
        }

        .portal-card {
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Размеры карточек */
        .portal-card.card-1 {
            width: 260px;
            height: 260px;
        }

        .portal-card.card-2 {
            width: 220px;
            height: 330px;
        }

        .portal-card.card-3 {
            width: 200px;
            height: 320px;
        }

        .portal-card.no-click {
            cursor: default;
        }

        .portal-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: none;
        }

        /* Иконка Soundcloud */
        .sc-link-box {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 100px;
            height: 100px;
            display: block;
            background: transparent;
            box-shadow: none;
        }

        .sc-link-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
        }

        /* Модалка для обычных видео */
        #video-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #video-modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 800px;
            cursor: default;
        }

        .modal-content video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        /* Экран выключения с off.mp4 */
        #shutdown-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999999;
            display: none;
            width: 100vw;
            height: 100vh;
        }

        #shutdown-screen.active {
            display: block;
        }

        #shutdown-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div id="start-screen">
        <div class="start-card">
            <img src="start.png" alt="Ракеты на Америку">
            <!-- Кнопка выверена ровно вокруг металического переключателя в центре -->
            <button class="start-click-area" onclick="startSite()" title="Нажать"></button>
        </div>
    </div>

    <!-- Звук для стартовой кнопки -->
    <audio id="start-sound" src="start-sound.mp3" preload="auto"></audio>

    <div id="site-wrapper">
        <!-- КНОПКА ВЫКЛЮЧЕНИЯ НА САЙТЕ -->
        <button class="power-btn" onclick="triggerShutdown(event)" title="Выключить">
            <img src="power.png" alt="Power Off">
        </button>

        <video id="bg-video" loop playsinline>
            <source src="background.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>

        <div class="portals-container">
            <div class="portal-card card-1" onclick="openVideo('edits.mp4')">
                <img src="caps.png" alt="Edit 1">
            </div>
            <div class="portal-card card-2" onclick="openVideo('edits2.mp4')">
                <img src="caps2.png" alt="Edit 2">
            </div>
            <div class="portal-card card-3 no-click">
                <img src="caps3.png" alt="Edit 3">
            </div>
        </div>

        <a href="https://soundcloud.com/naduvanie_online" target="_blank" class="sc-link-box" title="Soundcloud">
            <img src="glock19.png" alt="Glock19">
        </a>
    </div>

    <div id="video-modal" onclick="closeVideo()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <video id="popup-player" controls preload="auto" playsinline></video>
        </div>
    </div>

    <div id="shutdown-screen">
        <video id="shutdown-video" loop playsinline>
            <source src="off.mp4" type="video/mp4">
        </video>
    </div>

    <audio id="btn-sound" src="button.mp3" preload="auto"></audio>

    <script>
        const startScreen = document.getElementById('start-screen');
        const startSound = document.getElementById('start-sound');
        const modal = document.getElementById('video-modal');
        const player = document.getElementById('popup-player');
        const bgVideo = document.getElementById('bg-video');
        const siteWrapper = document.getElementById('site-wrapper');
        const shutdownScreen = document.getElementById('shutdown-screen');
        const shutdownVideo = document.getElementById('shutdown-video');
        const btnSound = document.getElementById('btn-sound');

        let isShutdown = false;

        function startSite() {
            // 1. Проигрываем звук кнопки
            if (startSound) {
                startSound.play().catch(() => {});
            }

            // 2. Скрываем стартовый экран (пауза в темноте)
            startScreen.classList.add('hidden');

            // 3. Держим тёмный экран 2 секунды
            setTimeout(() => {
                // 4. Появляется главная страница с эффектом включения ТВ
                siteWrapper.classList.add('tv-on');

                if (bgVideo) {
                    bgVideo.muted = false;
                    bgVideo.play().catch(err => {
                        console.log("Ошибка запуска фона:", err);
                    });
                }
            }, 2000); // 2000 мс = 2 секунды
        }

        function openVideo(videoSrc) {
            if (isShutdown) return;
            if (bgVideo) bgVideo.pause();
            player.src = videoSrc;
            player.load();
            modal.classList.add('active');
            player.play().catch(() => {});
        }

        function closeVideo() {
            if (isShutdown) return;
            player.pause();
            player.src = '';
            modal.classList.remove('active');
            if (bgVideo) bgVideo.play().catch(() => {});
        }

        function triggerShutdown(e) {
            if (e) e.stopPropagation();
            isShutdown = true;

            if (btnSound) btnSound.play().catch(() => {});
            siteWrapper.classList.remove('tv-on');
            siteWrapper.classList.add('tv-off');

            setTimeout(() => {
                if (bgVideo) bgVideo.pause();
                player.pause();
                modal.classList.remove('active');
                siteWrapper.style.display = 'none';

                setTimeout(() => {
                    shutdownScreen.classList.add('active');
                    shutdownVideo.currentTime = 0;
                    shutdownVideo.play().catch(() => {});
                }, 1000);

            }, 500);
        }

        document.addEventListener('keydown', (e) => {
            if (isShutdown) {
                e.preventDefault();
                return false;
            }
            if (e.key === 'Escape') {
                closeVideo();
            }
        });
    </script>
</body>
</html>
