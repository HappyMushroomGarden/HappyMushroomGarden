<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyMushroomGarden</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }

        /* Основной контейнер всего сайта */
        #site-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 1. Кнопка выключения сверху по центру */
        .power-btn {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 90px;
            height: 90px;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            transition: transform 0.2
