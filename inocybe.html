<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inocybe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #fullscreen-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 20;
            width: 80px;
            height: 80px;
            display: block;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            text-decoration: none;
        }

        .back-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
        }

        @media (max-width: 768px) {
            .back-btn {
                width: 65px;
                height: 65px;
                top: 15px;
                left: 15px;
            }
        }
    </style>
</head>
<body>

    <a href="mushroom.html" class="back-btn">
        <img src="back.png" alt="Back">
    </a>

    <video id="fullscreen-video" autoplay controls playsinline>
        <source src="edits2.mp4" type="video/mp4">
    </video>

</body>
</html>
