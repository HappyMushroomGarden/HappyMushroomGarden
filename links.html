<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | HappyMushroomGarden</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }

        /* Фоновое видео */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
            pointer-events: none;
        }

        /* Картинка-кнопка "Назад" в левом верхнем углу */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 20;
            width: 80px;
            height: 80px;
            display: block;
            background: transparent;
            outline: none;
            border: none;
            cursor: pointer;
        }

        .back-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
        }

        /* Вертикальный контейнер с картинками по центру */
        .links-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            z-index: 10;
            width: 100%;
            max-width: 90vw;
        }

        .link-card {
            display: block;
            text-decoration: none;
            /* Без эффектов увеличения и подсветки */
        }

        /* Настройки размеров карточек */
        .link-card.top-card img {
            width: 220px;
            height: auto;
            max-height: 120px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }

        .link-card.mid-card img {
            width: 200px;
            height: auto;
            max-height: 110px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }

        .link-card.bot-card img {
            width: 180px;
            height: auto;
            max-height: 100px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }

        /* Мобильный адаптив */
        @media (max-width: 768px) {
            .links-container {
                gap: 20px;
            }

            .link-card.top-card img {
                width: 170px;
            }

            .link-card.mid-card img {
                width: 150px;
            }

            .link-card.bot-card img {
                width: 130px;
            }

            .back-btn {
                width: 65px;
                height: 65px;
                top: 15px;
                left: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Картинка-кнопка Назад -->
    <a href="index.html" class="back-btn" title="Назад">
        <img src="back.png" alt="Back">
    </a>

    <!-- Фоновое видео -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="links-bg.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <!-- Контейнер со ссылками -->
    <div class="links-container">
        <!-- 1. Верхняя — ТГК Основа -->
        <a href="https://t.me/funnywounds" target="_blank" class="link-card top-card">
            <img src="tg-main.png" alt="ТГК Основа">
        </a>

        <!-- 2. Средняя — ТГК Личный -->
        <a href="https://t.me/canikill" target="_blank" class="link-card mid-card">
            <img src="tg-personal.png" alt="ТГК Личный">
        </a>

        <!-- 3. Нижняя — SoundCloud -->
        <a href="https://soundcloud.com/naduvanie_online" target="_blank" class="link-card bot-card">
            <img src="sc-link.png" alt="SoundCloud">
        </a>
    </div>

    <script>
        // Гарантированный запуск фонового видео
        const bgVideo = document.getElementById('bg-video');
        if (bgVideo) {
            bgVideo.muted = true;
            bgVideo.play().catch(err => {
                console.log("Автозапуск заблокирован браузером:", err);
            });
        }
    </script>
</body>
</html>
