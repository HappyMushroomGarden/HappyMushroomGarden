<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | HappyMushroomGarden</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }

        /* Фоновое видео */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
            pointer-events: none;
        }

        /* Кнопка "Назад" на главный сайт */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 20;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Вертикальный контейнер с картинками по центру */
        .links-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column; /* Элементы выстроены вертикально */
            align-items: center;
            justify-content: center;
            gap: 25px; /* Отступ между картинками */
            z-index: 10;
            width: 100%;
            max-width: 90vw;
        }

        .link-card {
            display: block;
            text-decoration: none;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .link-card:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        /* Настройка размеров для трех уровней карт */
        /* 1. Верхняя (самая высокая) */
        .link-card.top-card img {
            width: 220px;
            height: auto;
            max-height: 120px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }

        /* 2. Средняя (посередине) */
        .link-card.mid-card img {
            width: 200px;
            height: auto;
            max-height: 110px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }

        /* 3. Нижняя */
        .link-card.bot-card img {
            width: 180px;
            height: auto;
            max-height: 100px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }

        /* Мобильный адаптив */
        @media (max-width: 768px) {
            .links-container {
                gap: 20px;
            }

            .link-card.top-card img {
                width: 170px;
            }

            .link-card.mid-card img {
                width: 150px;
            }

            .link-card.bot-card img {
                width: 130px;
            }

            .back-btn {
                top: 15px;
                left: 15px;
                font-size: 14px;
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Кнопка возврата на главный сайт -->
    <a href="index.html" class="back-btn">← Назад</a>

    <!-- Новое фоновое видео для страницы ссылок -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="links-bg.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <!-- Контейнер со ссылками-картинками (снизу вверх по центру) -->
    <div class="links-container">
        <!-- 1. Верхняя (самая высокая) — ТГК Основа -->
        <a href="https://t.me/ТУТ_ТВОЙ_ТГК_ОСНОВА" target="_blank" class="link-card top-card">
            <img src="tg-main.png" alt="ТГК Основа">
        </a>

        <!-- 2. Средняя — ТГК Личный -->
        <a href="https://t.me/ТУТ_ТВОЙ_ЛИЧНЫЙ_ТГ" target="_blank" class="link-card mid-card">
            <img src="tg-personal.png" alt="ТГК Личный">
        </a>

        <!-- 3. Нижняя — SoundCloud -->
        <a href="https://soundcloud.com/naduvanie_online" target="_blank" class="link-card bot-card">
            <img src="sc-link.png" alt="SoundCloud">
        </a>
    </div>

</body>
</html>
