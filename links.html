<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyKinderGarten</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }

        /* Фоновое видео */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
            pointer-events: none;
        }

        /* Увеличенная картинка-кнопка "Назад" в левом верхнем углу (без title) */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 20;
            width: 105px;
            height: 105px;
            display: block;
            background: transparent;
            outline: none;
            border: none;
            cursor: pointer;
        }

        .back-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
        }

        /* Вертикальный контейнер с картинками по центру */
        .links-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            z-index: 10;
            width: 100%;
            max-width: 90vw;
        }

        .link-card {
            display: block;
            text-decoration: none;
        }

        /* Увеличенные размеры карточек */
        .link-card.top-card img {
            width: 290px;
            height: auto;
            max-height: 160px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }

        .link-card.mid-card img {
            width: 260px;
            height: auto;
            max-height: 145px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }

        .link-card.bot-card img {
            width: 230px;
            height: auto;
            max-height: 130px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.8));
        }

        /* Мобильный адаптив */
        @media (max-width: 768px) {
            .links-container {
                gap: 20px;
            }

            .link-card.top-card img {
                width: 210px;
            }

            .link-card.mid-card img {
                width: 190px;
            }

            .link-card.bot-card img {
                width: 170px;
            }

            .back-btn {
                width: 80px;
                height: 80px;
                top: 15px;
                left: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Картинка-кнопка Назад (без всплывающей подсказки) -->
    <a href="index.html" class="back-btn">
        <img src="back.png" alt="Back">
    </a>

    <!-- Фоновое видео -->
    <video id="bg-video" loop playsinline autoplay>
        <source src="links-bg.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <!-- Контейнер со ссылками -->
    <div class="links-container">
        <!-- 1. Верхняя — ТГК Основа -->
        <a href="https://t.me/funnywounds" target="_blank" class="link-card top-card">
            <img src="tg-main.png" alt="ТГК Основа">
        </a>

        <!-- 2. Средняя — ТГК Личный -->
        <a href="https://t.me/canikill" target="_blank" class="link-card mid-card">
            <img src="tg-personal.png" alt="ТГК Личный">
        </a>

        <!-- 3. Нижняя — SoundCloud -->
        <a href="https://soundcloud.com/naduvanie_online" target="_blank" class="link-card bot-card">
            <img src="sc-link.png" alt="SoundCloud">
        </a>
    </div>

    <script>
        const bgVideo = document.getElementById('bg-video');

        function enableSound() {
            if (bgVideo) {
                bgVideo.muted = false;
                bgVideo.play().catch(() => {});
            }
            document.removeEventListener('click', enableSound);
            document.removeEventListener('touchstart', enableSound);
        }

        document.addEventListener('click', enableSound);
        document.addEventListener('touchstart', enableSound);
    </script>
</body>
</html>
