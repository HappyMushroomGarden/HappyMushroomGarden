<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyMushroomGarden</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }

        #site-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Анимация выключения телевизора */
        #site-wrapper.tv-off {
            animation: tvShutdown 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            transform-origin: center center;
        }

        @keyframes tvShutdown {
            0% {
                transform: scale(1, 1);
                filter: brightness(1);
            }
            40% {
                transform: scale(1, 0.005);
                filter: brightness(2);
            }
            100% {
                transform: scale(0, 0);
                filter: brightness(0);
            }
        }

        /* Кнопка выключения в левом верхнем углу */
        .power-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 20;
            width: 80px;
            height: 80px;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
        }

        .power-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
        }

        /* Фоновое видео */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 2;
            pointer-events: none;
        }

        /* Контейнер кнопок (ПК-версия) */
        .items-container {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: row;
            gap: 100px;
            z-index: 10;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 95vw;
        }

        .item-card {
            flex-shrink: 0;
            display: block;
            text-decoration: none;
        }

        /* Десктопные размеры */
        .item-card.card-1 {
            width: 260px;
            height: 260px;
        }

        .item-card.card-2 {
            width: 220px;
            height: 330px;
        }

        .item-card.card-3 {
            width: 200px;
            height: 320px;
        }

        .item-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Иконка lake.html (Glock19) */
        .lake-link-box {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90px;
            height: 90px;
            display: block;
        }

        .lake-link-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.8));
        }

        /* АДАПТИВ ПОД МОБИЛЬНЫЕ ТЕЛЕФОНЫ */
        @media (max-width: 768px) {
            .items-container {
                gap: 20px;
            }

            .item-card.card-1 {
                width: 105px;
                height: 105px;
            }

            .item-card.card-2 {
                width: 95px;
                height: 145px;
            }

            .item-card.card-3 {
                width: 85px;
                height: 135px;
            }

            .power-btn {
                width: 65px;
                height: 65px;
                top: 15px;
                left: 15px;
            }

            .lake-link-box {
                width: 75px;
                height: 75px;
                bottom: 15px;
            }
        }

        /* Экран выключения с off.mp4 */
        #shutdown-screen {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999999;
            display: none;
            width: 100vw;
            height: 100vh;
        }

        #shutdown-screen.active {
            display: block;
        }

        #shutdown-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="site-wrapper">
        <!-- КНОПКА ВЫКЛЮЧЕНИЯ -->
        <button class="power-btn" onclick="triggerShutdown(event)">
            <img src="power.png" alt="Power Off">
        </button>

        <!-- Фоновое видео БЕЗ muted (со звуком) -->
        <video id="bg-video" loop autoplay playsinline>
            <source src="background.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>

        <div class="items-container">

            <a href="conocybula.html" class="item-card card-1">
                <img src="caps.png" alt="Conocybula">

            <a href="inocybe.html" class="item-card card-2">
                <img src="caps2.png" alt="Inocybe">
            </a>
            <a href="panaeolus.html" class="item-card card-3">
                <img src="caps3.png" alt="Panaeolus">
            </a>
        </div>

        <!-- Иконка glock19 ведет на lake.html -->
        <a href="lake.html" class="lake-link-box">
            <img src="glock19.png" alt="Lake">
        </a>
    </div>

        <video id="shutdown-video" loop playsinline>

        </video>
    </div>

    <audio id="btn-sound" src="button.mp3" preload="auto"></audio>
